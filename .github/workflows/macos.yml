name: macOS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Swift formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests App tools
      - name: Package tests
        run: swift test
      - name: Unsigned app build and analysis
        run: xcodebuild -project Lulo.xcodeproj -scheme Lulo -configuration Debug -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build analyze
      - name: Render native previews
        run: bash tools/render-previews.sh
      - name: Save native previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-previews
          path: build/previews/*.png
          retention-days: 7
      - name: Package universal test app
        run: bash tools/package-app.sh
      - name: Measure navigation and photo loading
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash tools/benchmark-navigation.sh "$BASELINE_REF" | tee build/navigation-benchmark.txt
      - name: Save test app
        id: app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lulo-macOS-universal
          path: build/distribution/Lulo-macOS-universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Link test app in run summary
        env:
          ARTIFACT_URL: ${{ steps.app.outputs.artifact-url }}
        run: echo "[Download Lulo for macOS 14+ (Apple Silicon and Intel)]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
