name: PR build download comment

on:
  workflow_run:
    workflows: [macOS]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-build-comments
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code runs with comment permissions.
      # Never check out the PR or download/execute its artifacts in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const comment = require('./.github/scripts/comment-pr-build.cjs');
            await comment({ github, context });
